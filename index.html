<title>קופת מלודי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Suez+One&family=Amatic+SC:wght@700&display=swap">
<style>
/* סימן ₪ אמיתי גם בכותרות (בגופן Suez One הוא נראה כמו "שח") */
@font-face{font-family:"ILS";src:local("Arial"),local("ArialMT"),local("Helvetica"),local("Segoe UI"),local("Roboto"),local("Noto Sans Hebrew"),local("Noto Sans"),local("DejaVu Sans");unicode-range:U+20AA}
/* Layout: espresso brand band (logo + tabs) over a dotted cream "paper" page; overview opens with a hero; panels are single-column on phone, tables scroll in their own frames. */
:root{
  --bg:#F7F5F2; --dots:rgb(90 75 60/.045); --surface:#FFFFFF; --sunk:#F2EFEA; --ink:#2A2521; --muted:#746B63; --line:#E6E1DA; --dot:#D3C7B8;
  --accent:#4A3E35; --accent-ink:#FAF7F2; --accent-soft:#EFEAE3; --crema:#D9AE7E; --latte:#E8CFAE;
  --band:#352E29; --band-ink:#FAF6F0; --band-muted:#C9BBAA;
  --good:#2F7A4D; --good-soft:#DCEFE1; --warn:#9A6408; --warn-soft:#F8E9C8; --bad:#B23A2B; --bad-soft:#F7DDD7;
  --shadow:0 1px 2px rgb(40 30 20/.05),0 8px 20px -16px rgb(40 30 20/.22);
  --f-display:"ILS","Suez One","Assistant",Georgia,serif; --f-body:"Assistant","Segoe UI",Arial,sans-serif; --f-hand:"Amatic SC","Assistant",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161412; --dots:rgb(230 210 185/.035); --surface:#201D1A; --sunk:#2A2622; --ink:#F2ECE4; --muted:#B3A79A; --line:#38322D; --dot:#56493D;
  --accent:#E3CBAA; --accent-ink:#1E1A16; --accent-soft:#35302A; --crema:#B98A5A; --latte:#E3CBAA;
  --band:#100E0C; --band-ink:#F4EEE6; --band-muted:#ADA090;
  --good:#6CCB93; --good-soft:#18301F; --warn:#E6B158; --warn-soft:#3A2B12; --bad:#F2887A; --bad-soft:#3E1D18;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 24px -16px rgb(0 0 0/.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161412; --dots:rgb(230 210 185/.035); --surface:#201D1A; --sunk:#2A2622; --ink:#F2ECE4; --muted:#B3A79A; --line:#38322D; --dot:#56493D;
  --accent:#E3CBAA; --accent-ink:#1E1A16; --accent-soft:#35302A; --crema:#B98A5A; --latte:#E3CBAA;
  --band:#100E0C; --band-ink:#F4EEE6; --band-muted:#ADA090;
  --good:#6CCB93; --good-soft:#18301F; --warn:#E6B158; --warn-soft:#3A2B12; --bad:#F2887A; --bad-soft:#3E1D18;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 24px -16px rgb(0 0 0/.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);background-image:radial-gradient(var(--dots) 1.2px,transparent 1.3px);background-size:20px 20px;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink);box-shadow:0 6px 18px -10px rgb(0 0 0/.45)}
.top::after{content:"";display:block;height:3px;background:repeating-linear-gradient(90deg,var(--latte) 0 5px,transparent 5px 11px);opacity:.35}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;padding-block:10px 4px;flex-wrap:wrap}
.brand img{width:50px;height:50px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--band),0 0 0 3px var(--latte)}
.brand .names{display:grid;line-height:1.05}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0;letter-spacing:.01em}
.brand .tag{font-family:var(--f-hand);font-size:1.15rem;color:var(--latte);letter-spacing:.02em}
.brand .grow{flex:1}
.month{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--band-muted)}
.month input{background:rgb(255 255 255/.08);border-color:rgb(255 255 255/.18);color:var(--band-ink);color-scheme:dark}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--band-muted);padding:6px 13px;border-radius:999px;font-weight:600;font-size:.93rem;white-space:nowrap;transition:background .15s,color .15s}
nav.tabs a:hover{color:var(--band-ink);background:rgb(255 255 255/.06)}
nav.tabs a[aria-current="page"]{background:var(--latte);color:#2E241C}
main{padding-block:22px 64px;display:grid;gap:20px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.55rem;margin:0;text-wrap:balance;letter-spacing:.01em}
h3{font-family:var(--f-display);font-weight:400;font-size:1.12rem;margin:0 0 12px;text-wrap:balance;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:9px;height:13px;flex:none;border-radius:50%;background:var(--crema);box-shadow:inset 1.5px 0 0 0 var(--surface);transform:rotate(25deg)}
.lead{color:var(--muted);margin:4px 0 0;max-width:68ch}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);outline:1.5px dotted var(--dot);outline-offset:-6px}
.kpi .l{font-size:.82rem;color:var(--muted);letter-spacing:.02em;font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .s{font-size:.82rem;color:var(--muted)}
.hero{position:relative;overflow:hidden;border-radius:calc(var(--r) + 4px);background:var(--band);color:var(--band-ink);padding:22px 22px 18px;box-shadow:var(--shadow)}
.hero .rays{position:absolute;inset-inline-start:-140px;top:-140px;width:460px;height:460px;opacity:.13;pointer-events:none}
.hero-in{position:relative;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero img{width:118px;height:118px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--band),0 0 0 4px var(--latte),0 14px 30px -10px rgb(0 0 0/.6)}
.hero .hi{font-family:var(--f-hand);font-size:1.7rem;color:var(--latte);line-height:1}
.hero h2{font-size:clamp(1.5rem,4.5vw,2.1rem);color:var(--band-ink)}
.hero .big{display:flex;gap:26px;flex-wrap:wrap;margin-top:10px}
.hero .big div{display:grid}
.hero .big b{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,5vw,2.3rem);font-variant-numeric:tabular-nums;line-height:1.15}
.hero .big span{font-size:.85rem;color:var(--band-muted)}
.hero .big .neg{color:#FF9C8C}
.hero .staff{display:block;width:100%;height:34px;margin-top:10px;opacity:.55}
.hero-txt{flex:1 1 260px;min-width:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--sunk);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--sunk) 35%,transparent)}
tfoot td{font-weight:700;background:var(--sunk)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
td input,td select{width:100%;border-color:transparent;background:transparent;padding:4px 5px}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus,input:focus,select:focus,textarea:focus{outline:2px solid var(--crema);outline-offset:-1px;border-color:transparent;background:var(--surface)}
input[type=number]{direction:ltr;text-align:right}
td select{width:auto;min-width:6.5em;max-width:16em}
td input.w-num{width:6.5em} td input.w-date{width:9.5em} td input.w-s{width:8em} td input.w-m{min-width:11em}
input:disabled,select:disabled{opacity:.8}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.9rem;text-decoration:none;color:var(--ink);transition:transform .12s,border-color .12s,background .12s}
.btn:hover{border-color:var(--crema)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 14px -8px rgb(60 35 15/.6)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 7px;box-shadow:none}
.btn.ghost:hover{color:var(--bad)}
.btn.danger{color:var(--bad)}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.banner{border-radius:12px;padding:9px 14px;font-size:.92rem;background:var(--warn-soft);color:var(--ink);border:1.5px dotted var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--warn)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(6em,9em) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar .t{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .t span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--crema)));border-radius:6px}
.bar.exp .t span{background:linear-gradient(90deg,var(--crema),var(--latte))}
.cols{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px;border-bottom:1.5px dotted var(--dot);background:repeating-linear-gradient(0deg,transparent 0 44px,var(--line) 44px 45px)}
.cols .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.cols .pair{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.cols .pair span{width:min(24px,40%);border-radius:7px 7px 0 0;min-height:2px}
.cols .inc{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,var(--crema)),var(--accent))} .cols .exp{background:linear-gradient(180deg,var(--latte),var(--crema))}
.cols-l{display:flex;gap:14px} .cols-l div{flex:1;text-align:center;font-size:.78rem;color:var(--muted);padding-top:4px}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin-bottom:4px} .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;background:var(--c)}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.field{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{color:var(--ink);font-size:.95rem;font-weight:400}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.stat{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:.94rem}
.stat dt{color:var(--muted)} .stat dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600;text-align:left}
.stat dd.big{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.sugg{display:grid;gap:8px}
.sugg li{list-style:none;border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface)}
.sugg ul{margin:0;padding:0;display:grid;gap:8px}
.sugg .gain{color:var(--good);font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast div{background:var(--band);color:var(--band-ink);padding:9px 18px;border-radius:999px;font-size:.92rem;box-shadow:0 8px 24px rgb(0 0 0/.25);border:1px solid var(--latte)}
.share{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.share span{display:block;height:100%;background:var(--crema)}
.claude-out{white-space:pre-wrap;background:var(--sunk);border-radius:12px;padding:12px;font-size:.93rem;max-height:420px;overflow:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 13px;cursor:pointer;font-size:.88rem;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
details summary{cursor:pointer;font-weight:600}
.ov-head{align-items:center;gap:14px;flex-wrap:nowrap}
.ov-logo{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.panel.wide{grid-column:1/-1}
@media (prefers-reduced-motion:no-preference){.ov-logo{animation:logoIn .9s ease-out both,logoFloat 6s ease-in-out 1s infinite}
  @keyframes logoIn{from{opacity:.6;transform:rotate(-8deg) scale(.95)}to{opacity:1;transform:none}}
  @keyframes logoFloat{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}}
.issue{border:1.5px dotted var(--crema)}
.issue summary{list-style:none} .issue summary::-webkit-details-marker{display:none}
.issue summary::after{content:"＋";float:left;color:var(--crema);font-weight:700;margin-top:-1.6em}
.issue[open] summary::after{content:"－"}
@media (max-width:640px){.top{position:relative;top:0}.brand img{width:42px;height:42px}.brand h1{font-size:1.2rem}.brand .tag{font-size:1rem}.hero{padding:18px 16px 14px}.hero img{width:96px;height:96px}}
small.note{color:var(--muted);font-size:.8rem}
.login-logo{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto 10px;box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--latte),var(--shadow)}
@media (prefers-reduced-motion:no-preference){.bar .t span,.share span{transition:width .4s}
  .hero img{animation:spinIn .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes spinIn{from{transform:rotate(-12deg) scale(.92)}to{transform:none}}}
</style>

const sq = { ops: [], timer: 0, busy: false, fails: 0 };

function enqueue(op) { sq.ops.push(op); ui.sync = 'saving'; clearTimeout(sq.timer); sq.timer = setTimeout(flush, 600); scheduleRender(); }

  catch (e) {

    ui.sync = 'error';
    if (sq.fails < 4) sq.timer = setTimeout(flush, 2000 * sq.fails);
    else toast('השמירה לגוגל שיטס נכשלה. בדוק חיבור לאינטרנט ולחץ "שמירה עכשיו".');

async function sheetsLoad(silent) {

    const j = await sheetsCall({ action: 'all' });
    if (sq.ops.length || sq.busy) return;
    COLS.forEach(c => (S[c] = j.data[c] || []));
    S.settings = { ...DEF, ...(j.settings || {}) };
    ui.sheetUrl = j.sheetUrl; mode = 'sheets'; ui.loginErr = '';

    if (!COLS.some(c => S[c].length) && !S.settings.sampleDone && typeof buildSample === 'function') seedSample();
  } catch (e) {
    if (silent) return;
    if (e.code === 'auth' && token) { logout('סיסמה שגויה.'); return; }
    ui.connErr = e.code === 'auth' ? 'בסקריפט בגוגל מוגדרת סיסמה. צריך להדביק ב-Apps Script את Code.gs העדכני (בלי סיסמה) ולפרוס גרסה חדשה.'
      : e.code === 'server' ? 'הסקריפט בגוגל החזיר שגיאה: ' + (e.message || '') + '. כדאי לוודא שהרצת את setup.'
      : 'לא הצלחתי להתחבר לגוגל שיטס. כדאי לבדוק שהפריסה מוגדרת "למי יש גישה: כל אחד" ושהכתובת נכונה.';

async function uploadFile(file) {

  if (mode === 'sheets') {
    const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); });
    const j = await sheetsCall({ action: 'upload', name: file.name, mimeType: file.type || 'application/pdf', data });

const canUpload = () => !readonly && ((mode === 'db' && !!assets) || mode === 'sheets');
const fileHref = i => i.fileUrl || (i.fileId ? '/_blob/' + i.fileId : '');

async function put(col, obj) {
  if (!obj.id) obj.id = newId(col[0]);
  if (mode === 'sheets') {
    const i = S[col].findIndex(x => x.id === obj.id);
    if (i >= 0) S[col][i] = { ...obj }; else S[col].push({ ...obj });
    enqueue({ op: 'put', col, id: obj.id, obj: clean(obj) }); scheduleRender();
    return obj.id;
  }
  if (mode === 'db') {
    const body = clean(obj);
    try { await serial(col + '/' + obj.id, () => db.collection(col).doc(obj.id).set(body)); }
    catch (e) { onWriteErr(e); }
  } else {
    const i = S[col].findIndex(x => x.id === obj.id);
    if (i >= 0) S[col][i] = { ...obj }; else S[col].push({ ...obj });
    saveLocal(); scheduleRender();
  }
  return obj.id;
}
function patch(col, id, part) { const cur = S[col].find(x => x.id === id); if (!cur) return; return put(col, { ...cur, ...part, sample: false }); }
async function del(col, id) {
  if (mode === 'sheets') { S[col] = S[col].filter(x => x.id !== id); enqueue({ op: 'del', col, id }); scheduleRender(); return; }
  if (mode === 'db') { try { await serial(col + '/' + id, () => db.collection(col).doc(id).delete()); } catch (e) { onWriteErr(e); } }
  else { S[col] = S[col].filter(x => x.id !== id); saveLocal(); scheduleRender(); }
}
async function saveSettings(part) {
  S.settings = { ...S.settings, ...part };
  if (mode === 'db') { const body = {}; for (const k in S.settings) if (JSON.stringify(S.settings[k]) !== JSON.stringify(DEF[k])) body[k] = S.settings[k]; try { await serial('settings', () => db.doc('settings/main').set(body)); } catch (e) { onWriteErr(e); } }
  else if (mode === 'sheets') enqueue({ op: 'settings', data: part });
  else saveLocal();
  scheduleRender();
}
async function bulk(tasks) { for (let i = 0; i < tasks.length; i += 6) await Promise.all(tasks.slice(i, i + 6).map(f => f())); }
function onWriteErr(e) {
  if (e && e.code === 'invalid_argument') { readonly = true; toast('אין לך הרשאת עריכה – המערכת במצב צפייה'); scheduleRender(); }
  else if (e && e.code === 'quota_exceeded') toast('נגמר המקום לשמירת נתונים. מחק נתונים ישנים ונסה שוב.');

let rq = 0;
function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }

async function boot() {
  $('#monthSel').value = month;
  window.addEventListener('hashchange', () => { route = routeFromHash(); render(); window.scrollTo(0, 0); });
  route = routeFromHash();
  const cl = window.claude;
  if (!cl || !cl.use) {
    if (lsGet('melody-local') !== '1') {
      if (!sheetsUrl) { mode = 'login'; render(); return; }
      render(); await sheetsLoad(false);
      setInterval(() => { if (document.visibilityState === 'visible' && mode === 'sheets') sheetsLoad(true); }, 60000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && mode === 'sheets') sheetsLoad(true); });
      window.addEventListener('beforeunload', e => { if (sq.ops.length) { flush(); e.preventDefault(); e.returnValue = ''; } });
      return;
    }
    mode = 'local'; loadLocal(); render(); return;
  }
  render();
  try { db = await cl.use('db'); } catch (e) { db = null; }
  if (!db) { mode = 'local'; loadLocal(); render(); return; }
  mode = 'db';
  const timer = setTimeout(() => { if (loaded.size < COLS.length) { ui.slow = true; scheduleRender(); } }, 10000);
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    S[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    if (!snap.metadata.fromCache) loaded.add(c);
    if (loaded.size === COLS.length) { clearTimeout(timer); ui.slow = false; }
    scheduleRender();
  }, err => { loaded.add(c); toast('לא הצלחתי לטעון חלק מהנתונים'); scheduleRender(); }));
  db.doc('settings/main').onSnapshot(s => { S.settings = { ...DEF, ...(s.exists ? s.data() : {}) }; scheduleRender(); }, () => { });
  cl.use('user').then(async u => { if (!u) return; const c = await u.can('data.write'); if (c === false) { readonly = true; scheduleRender(); } }).catch(() => { });
  cl.use('assets').then(a => { assets = a; scheduleRender(); }).catch(() => { });
  cl.use('sample').then(a => { sampleCap = a; scheduleRender(); }).catch(() => { });
  cl.use('downloads').then(a => { downloads = a; }).catch(() => { });
}
function routeFromHash() { const h = location.hash.slice(1); return ROUTES.some(r => r[0] === h) ? h : 'overview'; }

/* ===================== חישובים ===================== */
const vatF = () => 1 + num(S.settings.vat) / 100;
const isMurshe = () => S.settings.businessType !== 'patur';
const net = gross => (isMurshe() ? num(gross) / vatF() : num(gross));
function unitKey(u) { return UNITS[u] ? u : parseUnit(u); }
function baseOf(ing) { return BASE[unitKey(ing.packUnit)] || BASE.unit; }
function baseUnitLabel(ing) { return UNITS[baseOf(ing)[0]]; }
function unitCost(ing) { // עלות ליחידת בסיס (גרם / מ"ל / יחידה) כולל פחת, ללא מע"מ אם עוסק מורשה
  const q = num(ing.packQty) * baseOf(ing)[1]; if (!q) return 0;
  const w = Math.min(num(ing.waste), 90) / 100;
  return net(ing.packPrice) / q / (1 - w);
}
function prettyUnitCost(ing) {
  const b = baseOf(ing)[0], c = unitCost(ing);
  if (b === 'g') return ils(c * 1000) + ' לק"ג';
  if (b === 'ml') return ils(c * 1000) + ' לליטר';
  return ils(c, 2) + ' ליחידה';
}
function recMonthly(r) { return num(r.amount) / (FREQ[r.freq] || FREQ.monthly)[1]; }
function overheadMonthly() { return S.recurring.reduce((a, r) => a + net(recMonthly(r)), 0); }
function totalUnits() { return num(S.settings.monthlyUnits) || S.dishes.reduce((a, d) => a + num(d.monthlySales), 0); }
function overheadPerUnit() { const u = totalUnits(); return u ? overheadMonthly() / u : 0; }
function lineCost(line, ings) { const ing = ings[line.ingId]; return ing ? num(line.qty) * unitCost(ing) : 0; }
function calc(d, items, price) {
  const ings = byId('ingredients');
  items = items || d.items || []; price = price ?? d.price;
  const lines = items.map(l => ({ ...l, ing: ings[l.ingId], cost: lineCost(l, ings) }));
  const direct = lines.reduce((a, l) => a + l.cost, 0);
  const priceNet = net(price);
  const overhead = overheadPerUnit();
  const full = direct + overhead;
  const gross = priceNet - direct, profit = priceNet - full;
  const fc = priceNet ? (direct / priceNet) * 100 : null;
  const gm = priceNet ? (gross / priceNet) * 100 : null;
  const margin = priceNet ? (profit / priceNet) * 100 : null;
  const s = S.settings;
  let status = 'none';
  if (priceNet && direct) status = profit < 0 || fc > num(s.fcWarn) ? 'bad' : fc > num(s.fcGood) ? 'warn' : 'good';
  const tf = Math.max(5, num(s.targetFc)) / 100;
  const recPrice = direct ? Math.ceil(((direct / tf) * (isMurshe() ? vatF() : 1)) * 2) / 2 : 0;
  const sales = num(d.monthlySales);
  return { lines, direct, priceNet, overhead, full, gross, profit, fc, gm, margin, status, recPrice, sales, monthlyGross: gross * sales, monthlyProfit: profit * sales };
}
function menuEngineering() {
  const rows = S.dishes.map(d => ({ d, c: calc(d) })).filter(r => r.c.sales > 0 && r.c.priceNet > 0);
  const out = {};
  if (rows.length < 2) return out;
  const totalSales = rows.reduce((a, r) => a + r.c.sales, 0);
  const popTh = (totalSales / rows.length) * 0.7;
  const avgGross = rows.reduce((a, r) => a + r.c.gross * r.c.sales, 0) / totalSales;
  rows.forEach(r => { const hp = r.c.sales >= popTh, hm = r.c.gross >= avgGross; out[r.d.id] = hp && hm ? 'star' : hp ? 'horse' : hm ? 'puzzle' : 'dog'; });
  return out;
}
const STATUS_TXT = { good: 'רווחית', warn: 'גבולית', bad: 'בעייתית', none: 'חסר מידע' };
const statusChip = st => `<span class="chip ${st === 'none' ? '' : st}"><i></i>${STATUS_TXT[st]}</span>`;
function dueDate(inv) {
  const d = parseD(inv.date); if (!d) return null;
  const t = TERMS[inv.terms] || TERMS.immediate;
  if (t[1] == null) return d;
  const e = new Date(d.getFullYear(), d.getMonth() + 1, 0); e.setDate(e.getDate() + t[1]); return e;
}
function invState(inv) {
  if (inv.status === 'paid') return ['paid', 'שולם', 'good'];
  if (inv.status === 'disputed') return ['disputed', 'במחלוקת', 'acc'];
  const due = dueDate(inv); if (!due) return ['open', 'פתוח', ''];
  const days = Math.round((due - parseD(today())) / 864e5);
  const pre = inv.status === 'partial' ? 'שולם חלקית · ' : '';
  if (days < 0) return ['late', pre + `באיחור ${-days} ימים`, 'bad'];
  if (days <= 7) return ['soon', pre + (days === 0 ? 'לתשלום היום' : `לתשלום בעוד ${days} ימים`), 'warn'];
  return ['open', pre + `בעוד ${days} ימים`, ''];
}
const inMonth = (rows, ym) => rows.filter(r => String(r.date || '').startsWith(ym));
const sum = (rows, f = 'amount') => rows.reduce((a, r) => a + num(r[f]), 0);

  $('#tabs').innerHTML = ROUTES.map(([k, l]) => `<a href="#${k}" ${k === route ? 'aria-current="page"' : ''}>${l}</a>`).join('');
  const app = $('#app');

  ['ספירת מלאי שבועית', 'פעם בשבוע סופרים את המוצרים העיקריים: מלאי בתחילה + קניות − מלאי בסוף = מה שנוצל. נותן עלות מזון אמיתית ומראה פחת, אבל דורש לרשום גם את הקניות בסופר.', 'בקרה, לא תמהיל'],
];
function salesIssue(compact) {
  if (compact) return `<div class="banner" style="border-color:var(--accent);background:var(--accent-soft)"><span style="flex:1 1 220px"><b style="color:var(--accent)">נושא פתוח:</b> כרגע אין דרך מוגדרת לתעד מה נמכר ומה נקנה. המספרים כאן הם הערכות של בעל העסק.</span><a class="btn" href="#overview" data-act="showIssue">האפשרויות</a></div>`;
  return `<details class="panel issue" id="salesIssue" ${ui.issueOpen ? 'open' : ''}>
    <summary><h3 style="display:inline-flex;margin:0">נושא פתוח לבעל העסק: איך מתעדים מכירות וקניות</h3><span class="muted" style="display:block;font-size:.88rem;margin-top:2px">מספרי המכירות כאן הם הערכה עד שנבחר שיטת תיעוד. 6 אפשרויות, לחצו לפרטים.</span></summary>
    <div style="margin-top:12px">
    <p style="margin:0 0 10px;max-width:72ch">היום המכירות מתועדות רק כחיובים במסופון האשראי, בלי פירוט של מה נמכר, ומזומן וביט לא נרשמים בכלל. גם חלק מהקניות (השלמות בסופר) נעשות בלי חשבונית. לכן מספר המנות שנמכרות בחודש, וכל מה שנגזר ממנו (רווח חודשי לכל מנה, סיווג המנות), מבוסס כרגע על הערכה. עלות כל מנה לפי המתכון לא תלויה בזה והיא מדויקת.</p>
    <p style="margin:0 0 6px"><b>האפשרויות. אפשר לבחור אחת או לשלב:</b></p>
    <ul style="margin:0;padding-inline-start:20px;display:grid;gap:8px;max-width:80ch">${SALES_OPTIONS.map(([t, d, a]) => `<li><b>${esc(t)}</b> <span class="chip">${esc(a)}</span><br><span class="muted">${esc(d)}</span></li>`).join('')}</ul>
    <p style="margin:12px 0 0;max-width:72ch"><b>קניות בסופר:</b> כדאי לצלם כל קבלה ולהעלות אותה כהוצאה. זה גם מוכר מול רואת החשבון, וכסף שהולך לאיבוד כשהקבלות נעלמות.</p>
    <p class="muted" style="margin:6px 0 0;font-size:.88rem">חשוב: כל שיטה צריכה להתאים לעבודה בעגלה. אסור שהיא תוסיף לעובדים הקלדה בזמן עומס.</p>
  </div></details>`;
}

/* ---------- סקירה ---------- */
PAGES.overview = () => {
  const t = monthTotals(month), prev = monthTotals(shiftMonth(month, -1));
  const profit = t.income - t.expenses;
  const open = S.invoices.filter(i => i.status !== 'paid');
  const late = open.filter(i => invState(i)[0] === 'late');
  const months = Array.from({ length: 6 }, (_, i) => shiftMonth(month, i - 5)).map(m => ({ m, ...monthTotals(m) }));
  const max = Math.max(1, ...months.flatMap(x => [x.income, x.expenses]));
  const expG = groupSum(inMonth(S.expenses, month), 'category');
  const incG = groupSum(inMonth(S.income, month), 'category');
  const dishes = S.dishes.map(d => ({ d, c: calc(d) })).filter(r => r.c.priceNet && r.c.direct).sort((a, b) => b.c.margin - a.c.margin);
  const ohm = overheadMonthly();
  const totalSales = dishes.reduce((a, r) => a + r.c.sales, 0);
  const avgGross = totalSales ? dishes.reduce((a, r) => a + r.c.gross * r.c.sales, 0) / totalSales : (dishes.length ? dishes.reduce((a, r) => a + r.c.gross, 0) / dishes.length : 0);
  const be = avgGross > 0 ? Math.ceil(ohm / avgGross) : 0;
  const delta = (a, b) => (b ? `<span class="${a >= b ? 'pos' : 'neg'}">${a >= b ? '▲' : '▼'} ${pct(Math.abs((a - b) / b) * 100, 0)}</span> מול חודש קודם` : '');
  const bars = (rows, cls, total) => rows.length ? `<div class="bars">${rows.map(([k, v]) => `<div class="bar ${cls}"><span>${esc(k)}</span><div class="t"><span style="width:${(v / rows[0][1]) * 100}%"></span></div><span class="num">${ils(v)} <small class="muted">${pct((v / total) * 100, 0)}</small></span></div>`).join('')}</div>` : `<p class="empty">אין רשומות בחודש הזה.</p>`;
  const logo = $('#brandLogo') ? $('#brandLogo').src : '';
  const deltaP = (a, b) => (b ? `<span class="${a >= b ? 'pos' : 'neg'}">${a >= b ? '▲' : '▼'} ${pct(Math.abs((a - b) / Math.abs(b)) * 100, 0)}</span> מול חודש קודם` : '<span class="muted">אין נתון לחודש קודם</span>');
  const deltaE = deltaP; // לבקשת המשתמש: ירידה תמיד באדום, עלייה תמיד בירוק
  const prevProfit = prev.income - prev.expenses;
  return `
  <div class="head ov-head">${logo ? `<img class="ov-logo" src="${logo}" alt="">` : ''}<div style="flex:1;min-width:0"><h2>סקירה · ${esc(monthName(month))}</h2><p class="lead">כמה נכנס, כמה יצא, ומה מצב החשבוניות.</p></div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">הכנסות</div><div class="v num">${ils(t.income)}</div><div class="s">${deltaP(t.income, prev.income)}</div></div>
    <div class="kpi"><div class="l">הוצאות</div><div class="v num">${ils(t.expenses)}</div><div class="s">${deltaE(t.expenses, prev.expenses)}</div></div>
    <div class="kpi"><div class="l">רווח תפעולי</div><div class="v num ${profit < 0 ? 'neg' : ''}">${ils(profit)}</div><div class="s">${deltaP(profit, prevProfit)}</div></div>
    <div class="kpi"><div class="l">חשבוניות פתוחות</div><div class="v num">${ils(sum(open))}</div><div class="s">${open.length} חשבוניות · ${late.length ? `<span class="neg">${late.length} באיחור (${ils(sum(late))})</span>` : '<span class="pos">אין באיחור</span>'}</div></div>
  </div>
  ${salesIssue()}
  <div class="grid g2">
    <section class="panel wide"><h3>הכנסות מול הוצאות – חצי שנה</h3>
      <div class="legend"><span style="--c:var(--accent)">הכנסות</span><span style="--c:var(--crema)">הוצאות</span></div>
      <div class="cols">${months.map(x => `<div class="m" title="${esc(monthName(x.m))}: הכנסות ${ils(x.income)}, הוצאות ${ils(x.expenses)}"><div class="pair"><span class="inc" style="height:${(x.income / max) * 100}%"></span><span class="exp" style="height:${(x.expenses / max) * 100}%"></span></div></div>`).join('')}</div>
      <div class="cols-l">${months.map(x => `<div>${esc(parseD(x.m + '-01').toLocaleDateString('he-IL', { month: 'short' }))}</div>`).join('')}</div>
    </section>
    <section class="panel"><h3>לאן הולך הכסף</h3>${bars(expG, 'exp', t.expenses || 1)}</section>
    <section class="panel"><h3>מאיפה נכנס הכסף</h3>${bars(incG, '', t.income || 1)}</section>
    <section class="panel"><h3>המנות הכי רווחיות</h3>${miniDishes(dishes.slice(0, 3))}</section>
    <section class="panel"><h3>המנות הכי פחות רווחיות</h3>${miniDishes(dishes.slice(-3).reverse())}<p style="margin:10px 0 0"><a class="btn" href="#optimize">לייעול מנה</a></p></section>
  </div>`;
};
function miniDishes(rows) {
  if (!rows.length) return '<p class="empty">עוד אין מנות עם מחיר ומתכון.</p>';
  return `<div class="tbl"><table><thead><tr><th>מנה</th><th>רווח למנה</th><th>% רווח</th><th></th></tr></thead><tbody>${rows.map(({ d, c }) => `<tr><td>${esc(d.name)}</td><td class="num">${ils(c.profit, 2)}</td><td class="num">${pct(c.margin)}</td><td>${statusChip(c.status)}</td></tr>`).join('')}</tbody></table></div>`;
}

    <div class="row"><label class="field" for="dishSort">מיון<select id="dishSort">${kvOpts({ margin: '% רווח', profit: 'רווח למנה', monthly: 'רווח חודשי', fc: 'עלות מזון נמוכה', name: 'שם' }, k)}</select></label>

  <div class="tbl"><table>

    <tbody>${rows.map(({ d, c }) => `<tr class="click ${d.id === ui.dishId ? 'sel' : ''}" data-act="openDish" data-id="${d.id}">
      <td><b>${esc(d.name) || '<span class="muted">ללא שם</span>'}</b></td><td class="muted">${esc(d.category)}</td>
      <td class="num">${ils(d.price, 2)}</td><td class="num">${ils(c.direct, 2)}</td><td class="num">${ils(c.full, 2)}</td>
      <td class="num ${c.profit < 0 ? 'neg' : ''}">${ils(c.profit, 2)}</td><td class="num">${pct(c.fc)}</td><td class="num"><b>${pct(c.margin)}</b></td>
      <td class="num">${nf0.format(c.sales)}</td><td class="num">${ils(c.monthlyProfit)}</td>
      <td>${me[d.id] ? `<span class="chip ${ME_CLASS[me[d.id]][1]}" title="${esc(ME_CLASS[me[d.id]][2])}">${ME_CLASS[me[d.id]][0]}</span>` : ''}</td><td>${statusChip(c.status)}</td></tr>`).join('') || `<tr><td colspan="12" class="empty">עוד אין מנות. לחץ "מנה חדשה" כדי להתחיל.</td></tr>`}</tbody>
  </table></div>
  <section class="panel"><h3>איך לקרוא את הטבלה</h3>
    <p class="muted" style="margin:0 0 8px">עלות מזון (Food cost) = עלות חומרי הגלם חלקי מחיר המכירה${isMurshe() ? ' ללא מע"מ' : ''}. ירוק עד ${S.settings.fcGood}%, צהוב עד ${S.settings.fcWarn}%, אדום מעל או כשהמנה מפסידה אחרי העמסת הוצאות. % רווח מחושב אחרי העמסה.</p>
    <div class="row">${Object.values(ME_CLASS).map(([n, c, t]) => `<span class="chip ${c}" title="${esc(t)}">${n}</span><small class="note" style="flex:1 1 220px">${esc(t)}</small>`).join('')}</div>
  </section>`;
};

/* ---------- ייעול מנה ---------- */
PAGES.optimize = () => {
  const dishes = S.dishes.slice().sort((a, b) => (calc(a).margin ?? 1e9) - (calc(b).margin ?? 1e9));
  if (!dishes.length) return `<h2>ייעול מנה</h2><p class="empty">צריך קודם להוסיף מנות.</p>`;
  if (!ui.optId || !S.dishes.some(d => d.id === ui.optId)) ui.optId = dishes[0].id;
  const d = S.dishes.find(x => x.id === ui.optId);
  if (!ui.sim || ui.sim.id !== d.id) ui.sim = { id: d.id, items: JSON.parse(JSON.stringify(d.items || [])), price: d.price };
  const cur = calc(d), sim = calc(d, ui.sim.items, ui.sim.price);
  const sugg = suggestions(d, cur);
  const ings = S.ingredients.slice().sort((a, b) => String(a.name).localeCompare(b.name, 'he'));
  const diff = (a, b, f = v => ils(v, 2), better = 1) => { const dv = b - a; if (Math.abs(dv) < 0.005) return '<span class="muted">ללא שינוי</span>'; return `<span class="${dv * better > 0 ? 'pos' : 'neg'}">${dv > 0 ? '+' : ''}${f(dv)}</span>`; };
  const changed = JSON.stringify(ui.sim.items) !== JSON.stringify(d.items || []) || num(ui.sim.price) !== num(d.price);
  return `
  <div class="head"><div><h2>ייעול מנה</h2><p class="lead">מנסים שינויים קטנים במתכון או במחיר ורואים מיד מה קורה לרווח, בלי לשנות את המנה עד שלוחצים "שמירה". ההצעות מבוססות על חומרי הגלם שכבר יש במערכת, וכל שינוי במנה צריך טעימה לפני שמכניסים לתפריט.</p></div>
    <label class="field" for="optSel">מנה<select id="optSel">${dishes.map(x => { const c = calc(x); return `<option value="${x.id}" ${x.id === d.id ? 'selected' : ''}>${esc(x.name)} · ${pct(c.margin, 0)}</option>`; }).join('')}</select></label></div>
  <div class="split">
    <section class="panel"><h3>הצעות לשיפור</h3>
      <div class="sugg"><ul>${sugg.map((s, i) => `<li><div style="flex:1 1 240px"><b>${esc(s.title)}</b><br><small class="muted">${esc(s.why)}</small></div><span class="gain">${s.gain > 0 ? '+' + ils(s.gain, 2) + ' למנה' : ''}</span>${s.apply ? `<button class="btn" data-act="applySugg" data-i="${i}">לנסות</button>` : ''}</li>`).join('') || '<li class="muted">לא נמצאו הצעות אוטומטיות. אפשר לשנות כמויות ידנית בסימולציה.</li>'}</ul></div>

function suggestions(d, cur) {
  const out = [], ings = byId('ingredients'), items = d.items || [];
  items.forEach((l, i) => {
    const ing = ings[l.ingId]; if (!ing) return;
    const base = baseOf(ing)[0];
    if (ing.category === 'חד-פעמי ואריזות') return;
    S.ingredients.filter(o => o.id !== ing.id && o.category === ing.category && baseOf(o)[0] === base && sameKind(o.name, ing.name) && unitCost(o) < unitCost(ing) - 1e-9)
      .forEach(o => {
        const gain = num(l.qty) * (unitCost(ing) - unitCost(o));
        if (gain < 0.03) return;
        const items2 = items.map((x, j) => (j === i ? { ...x, ingId: o.id } : x));
        out.push({ title: `להחליף "${ing.name}" ב"${o.name}"`, why: `אותה קטגוריה (${ing.category}), זול יותר ב-${pct((1 - unitCost(o) / unitCost(ing)) * 100, 0)} ליחידה. לבדוק טעם ומרקם לפני שינוי קבוע.`, gain, apply: { items: items2 } });
      });
  });
  const lines = cur.lines.filter(l => l.ing && l.ing.category !== 'חד-פעמי ואריזות').sort((a, b) => b.cost - a.cost);
  if (lines[0] && cur.direct) {
    const l = lines[0], share = l.cost / cur.direct, idx = items.findIndex(x => x.ingId === l.ingId);
    if (share > 0.25 && num(l.qty) > 1) {
      const newQ = Math.round(num(l.qty) * 0.9 * 10) / 10;
      out.push({ title: `להקטין את "${l.ing.name}" ב-10% (${l.qty} ← ${newQ} ${baseUnitLabel(l.ing)})`, why: `המרכיב הזה הוא ${pct(share * 100, 0)} מעלות המנה. הפחתה קטנה בדרך כלל לא מורגשת, אבל חשוב לטעום.`, gain: l.cost * 0.1, apply: { items: items.map((x, j) => (j === idx ? { ...x, qty: newQ } : x)) } });
    }
  }
  const waste = cur.lines.filter(l => l.ing && num(l.ing.waste) >= 8).sort((a, b) => b.cost - a.cost)[0];
  if (waste) {
    const w = num(waste.ing.waste) / 100, half = w / 2;
    const gain = waste.cost - waste.cost * (1 - w) / (1 - half);
    if (gain > 0.03) out.push({ title: `לצמצם פחת של "${waste.ing.name}" (${waste.ing.waste}%)`, why: 'למשל הזמנה בכמויות קטנות יותר, אחסון טוב יותר או מכירת עודפים בסוף היום. חצי מהפחת שווה את הסכום הזה.', gain, apply: null });
  }
  const pack = cur.lines.filter(l => l.ing && l.ing.category === 'חד-פעמי ואריזות').reduce((a, l) => a + l.cost, 0);
  if (cur.direct && pack / cur.direct > 0.2) out.push({ title: 'אריזה יקרה ביחס למנה', why: `כוס, מכסה ושאר החד-פעמי הם ${pct((pack / cur.direct) * 100, 0)} מעלות המנה. כדאי לבקש הצעת מחיר מספק נוסף או לקנות בכמות גדולה יותר.`, gain: 0, apply: null });
  if (cur.recPrice && num(d.price) < cur.recPrice - 0.25) {
    const p = Math.min(cur.recPrice, Math.ceil(num(d.price) * 1.1 * 2) / 2);
    out.push({ title: `להעלות מחיר ל-${ils(p, 2)}`, why: p < cur.recPrice ? `המחיר שמביא את עלות המזון ליעד של ${S.settings.targetFc}% הוא ${ils(cur.recPrice, 2)}. עלייה הדרגתית של עד 10% בדרך כלל עוברת בלי לאבד לקוחות.` : `זה המחיר שמביא את עלות המזון ליעד של ${S.settings.targetFc}%.`, gain: net(p) - net(d.price), apply: { price: p } });
  }
  else if (cur.status !== 'good' && num(d.price)) { const p = num(d.price) + 1; out.push({ title: `להעלות מחיר בשקל (ל-${ils(p, 2)})`, why: 'שינוי קטן שרוב הלקוחות לא מרגישים.', gain: net(p) - net(d.price), apply: { price: p } }); }
  return out.sort((a, b) => b.gain - a.gain).slice(0, 8);
}
function sameKind(a, b) { const k = s => String(s).split(/[\s–\-,()]+/).filter(t => t && !/\d/.test(t)).slice(0, 2).join(' '); return k(a) === k(b); }
async function askClaude() {
  const d = S.dishes.find(x => x.id === ui.optId); if (!d || !sampleCap) return;
  const c = calc(d);
  const alts = S.ingredients.map(i => `${i.name} (${i.category}): ${prettyUnitCost(i)}`).join('\n');
  const prompt = `אתה יועץ לבתי קפה קטנים. עגלת קפה בישראל רוצה לשפר את הרווחיות של מנה אחת בלי לפגוע באיכות ובחוויית הלקוח.
מנה: ${d.name}. מחיר ללקוח ${num(d.price)} ש"ח כולל מע"מ. מכירות בחודש: ${c.sales}.
מתכון ועלויות (ללא מע"מ):
${c.lines.map(l => `- ${l.ing ? l.ing.name : '?'}: ${l.qty} ${l.ing ? baseUnitLabel(l.ing) : ''}, עלות ${l.cost.toFixed(2)} ש"ח`).join('\n')}
עלות חומרים ${c.direct.toFixed(2)} ש"ח, עלות מזון ${c.fc?.toFixed(1)}%, רווח נקי למנה אחרי העמסת הוצאות ${c.profit.toFixed(2)} ש"ח.
חומרי גלם זמינים במערכת:
${alts}
תן 3 עד 5 הצעות קונקרטיות ומעשיות בעברית: החלפת מרכיב, שינוי כמות, אריזה, תמחור או אפסייל. לכל הצעה: מה לעשות, כמה בערך חוסכים או מרוויחים למנה, ומה הסיכון לטעם או ללקוח. בלי הקדמות, רשימה ממוספרת קצרה, טקסט פשוט בלי Markdown.`;
  ui.claudeBusy = true; ui.claude = ''; render();
  try {
    const r = await sampleCap(prompt, { onText: ({ text }) => { ui.claude = text; const o = $('#claudeOut'); if (o) o.textContent = text; else scheduleRender(); } });
    ui.claude = r.text;
  } catch (e) { ui.claude = e && e.code === 'not_granted' ? 'הגישה ל-Claude לא אושרה בעמוד הזה.' : 'לא הצלחתי לקבל תשובה כרגע. נסה שוב בעוד רגע.'; if (e && e.code === 'not_granted') sampleCap = null; }
  ui.claudeBusy = false; render();
}

    <div class="tbl" style="margin-top:10px"><table><thead><tr><th>שם</th><th>קטגוריה</th><th>סכום כולל מע"מ</th>${kind === 'fixed' ? '<th>תדירות</th>' : '<th>חודש חלש</th><th>חודש חזק</th>'}<th>בחודש</th><th>למי</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${inp('recurring', r, 'name', 'w-m')}</td><td>${sel('recurring', r, 'category', cats)}</td><td>${inp('recurring', r, 'amount', 'w-num', 1)}</td>
      ${kind === 'fixed' ? `<td><select id="recurring-${r.id}-freq" data-col="recurring" data-id="${r.id}" data-f="freq" ${dis()}>${kvOpts(FREQ, r.freq || 'monthly')}</select></td>` : `<td>${inp('recurring', r, 'low', 'w-num', 1)}</td><td>${inp('recurring', r, 'high', 'w-num', 1)}</td>`}
      <td class="num">${ils(recMonthly(r))}</td><td>${inp('recurring', r, 'payee', 'w-s')}</td><td>${delBtn('recurring', r.id, 'מחיקה')}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">אין הוצאות עדיין.</td></tr>'}
    </tbody>${rows.length ? `<tfoot><tr><td colspan="${kind === 'fixed' ? 4 : 5}">סה"כ בחודש</td><td class="num">${ils(tot)}</td><td colspan="2"></td></tr></tfoot>` : ''}</table></div></section>`;
  };
  const ohm = overheadMonthly(), units = totalUnits(), auto = S.dishes.reduce((a, d) => a + num(d.monthlySales), 0);
  return `<div class="head"><div><h2>הוצאות קבועות ושוטפות</h2><p class="lead">הבסיס לחישוב העלות המלאה של כל מנה ולנקודת האיזון. הסכום החודשי מתחלק על כל המנות שנמכרות בחודש.</p></div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">סה"כ בחודש${isMurshe() ? ' (ללא מע"מ)' : ''}</div><div class="v num">${ils(ohm)}</div><div class="s">${ils(ohm * 12)} בשנה</div></div>
    <div class="kpi"><div class="l">מנות בחודש לחלוקה</div><div class="v num"><input id="monthlyUnits" type="number" inputmode="numeric" data-setting="monthlyUnits" value="${esc(S.settings.monthlyUnits || '')}" placeholder="${auto}" style="width:7em;font-size:1.1rem" ${dis()}></div><div class="s">ריק = לפי מכירות המנות (${nf0.format(auto)})</div></div>
    <div class="kpi"><div class="l">העמסה על כל מנה</div><div class="v num">${ils(overheadPerUnit(), 2)}</div><div class="s">${nf0.format(units)} מנות בחודש</div></div>
  </div>
  ${part('fixed')}${part('variable')}`;
};

/* ---------- חשבוניות ---------- */
PAGES.invoices = () => {
  const all = S.invoices.map(i => ({ i, st: invState(i), due: dueDate(i) }));
  const f = ui.invFilter;
  const rows = all.filter(r => f === 'all' || (f === 'open' && r.st[0] !== 'paid') || (f === 'late' && r.st[0] === 'late') || (f === 'paid' && r.st[0] === 'paid'))
    .sort((a, b) => (a.st[0] === 'paid') - (b.st[0] === 'paid') || (a.due || 0) - (b.due || 0));
  const open = all.filter(r => r.st[0] !== 'paid');
  const byTerm = Object.keys(TERMS).map(k => [k, open.filter(r => (r.i.terms || 'immediate') === k)]).filter(x => x[1].length);
  const notSent = S.invoices.filter(i => !i.sentToAccountant);
  return `
  <div class="head"><div><h2>חשבוניות ספקים</h2><p class="lead">כל חשבונית עם תנאי התשלום שלה. תאריך התשלום מחושב לבד: מיידי ביום החשבונית, שוטף+30 הוא 30 יום אחרי סוף החודש של החשבונית.</p></div>
  <button class="btn pri" data-act="invForm" ${dis()}>${ui.invForm ? 'סגירת טופס' : '+ חשבונית'}</button></div>
  <div class="kpis">
    <div class="kpi"><div class="l">פתוח לתשלום</div><div class="v num">${ils(sum(open.map(r => r.i)))}</div><div class="s">${open.length} חשבוניות</div></div>
    <div class="kpi"><div class="l">באיחור</div><div class="v num ${open.some(r => r.st[0] === 'late') ? 'neg' : ''}">${ils(sum(open.filter(r => r.st[0] === 'late').map(r => r.i)))}</div><div class="s">${open.filter(r => r.st[0] === 'late').length} חשבוניות</div></div>
    <div class="kpi"><div class="l">לתשלום ב-7 הימים הקרובים</div><div class="v num">${ils(sum(open.filter(r => r.st[0] === 'soon').map(r => r.i)))}</div><div class="s">${open.filter(r => r.st[0] === 'soon').length} חשבוניות</div></div>
  </div>
  ${byTerm.length ? `<section class="panel"><h3>פתוח לפי תנאי תשלום</h3><div class="bars">${byTerm.map(([k, rs]) => `<div class="bar exp"><span>${TERMS[k][0]}</span><div class="t"><span style="width:${(sum(rs.map(r => r.i)) / Math.max(...byTerm.map(x => sum(x[1].map(r => r.i))))) * 100}%"></span></div><span class="num">${ils(sum(rs.map(r => r.i)))} · ${rs.length}</span></div>`).join('')}</div></section>` : ''}
  ${ui.invForm ? invForm() : ''}
  <div class="row"><div class="seg" role="group" aria-label="סינון חשבוניות">${[['open', 'פתוחות'], ['late', 'באיחור'], ['paid', 'שולמו'], ['all', 'הכל']].map(([k, l]) => `<button data-act="invFilter" data-v="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div></div>
  <div class="tbl"><table><thead><tr><th>ספק</th><th>מס' חשבונית</th><th>תאריך</th><th>סכום</th><th>תנאי תשלום</th><th>לתשלום עד</th><th>מצב</th><th>סטטוס</th><th>קובץ</th><th>הועבר לרו"ח</th><th></th></tr></thead><tbody>
  ${rows.map(({ i, st, due }) => `<tr>
    <td><input id="invoices-${i.id}-supplier" class="w-s" list="supList3" data-col="invoices" data-id="${i.id}" data-f="supplier" value="${esc(i.supplier)}" ${dis()}></td>
    <td>${inp('invoices', i, 'number', 'w-s')}</td><td>${inp('invoices', i, 'date', 'w-date', 0, 'date')}</td><td>${inp('invoices', i, 'amount', 'w-num', 1)}</td>
    <td><select id="invoices-${i.id}-terms" data-col="invoices" data-id="${i.id}" data-f="terms" ${dis()}>${kvOpts(TERMS, i.terms || 'immediate')}</select></td>
    <td class="num">${due ? fmtD(ymd(due)) : ''}</td><td><span class="chip ${st[2]}">${esc(st[1])}</span></td>
    <td><select id="invoices-${i.id}-status" data-col="invoices" data-id="${i.id}" data-f="status" ${dis()}>${kvOpts(INV_STATUS, i.status || 'unpaid')}</select>${i.status === 'paid' && i.paidDate ? `<br><small class="note">${fmtD(i.paidDate)}</small>` : ''}</td>
    <td>${fileHref(i) ? `<a href="${esc(fileHref(i))}" target="_blank" rel="noopener">${esc(i.fileName || 'צפייה')}</a>` : canUpload() ? `<label class="btn" for="up-${i.id}">העלאה</label><input type="file" id="up-${i.id}" accept="application/pdf,image/*" data-upload="${i.id}" hidden>` : '<span class="muted">—</span>'}</td>
    <td><input type="checkbox" id="invoices-${i.id}-sent" data-col="invoices" data-id="${i.id}" data-f="sentToAccountant" data-bool ${i.sentToAccountant ? 'checked' : ''} ${dis()} aria-label="הועבר לרואת החשבון"></td>
    <td>${delBtn('invoices', i.id, 'מחיקה')}</td></tr>`).join('') || `<tr><td colspan="11" class="empty">אין חשבוניות בתצוגה הזו.</td></tr>`}
  </tbody></table></div>
  <datalist id="supList3">${S.suppliers.map(s => `<option value="${esc(s.name)}">`).join('')}</datalist>
  <section class="panel"><h3>רואת החשבון</h3>
    <div class="form"><label class="field" for="accName">שם<input id="accName" data-setting="accountantName" value="${esc(S.settings.accountantName)}" ${dis()}></label>
    <label class="field" for="accEmail">אימייל<input id="accEmail" type="email" dir="ltr" data-setting="accountantEmail" value="${esc(S.settings.accountantEmail)}" ${dis()}></label></div>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="exportAcc" ${notSent.length ? '' : 'disabled'}>ייצוא ${notSent.length} חשבוניות שלא הועברו לאקסל</button>
    <small class="note" style="flex:1 1 260px">בינתיים מייצאים קובץ ושולחים לרואת החשבון ידנית. חיבור ישיר למערכת שלה יתווסף בהמשך, וכל חשבונית כבר מסומנת אם הועברה.</small></div>
  </section>`;
};

  const f = ui.newInv || (ui.newInv = { supplier: '', number: '', date: today(), amount: '', terms: '', status: 'unpaid' });
  return `<section class="panel"><h3>חשבונית חדשה</h3>
  <div class="form">
    <label class="field" for="ni-supplier">ספק<input id="ni-supplier" list="supList3" data-new="supplier" value="${esc(f.supplier)}"></label>
    <label class="field" for="ni-number">מספר חשבונית<input id="ni-number" data-new="number" value="${esc(f.number)}"></label>
    <label class="field" for="ni-date">תאריך<input id="ni-date" type="date" data-new="date" value="${esc(f.date)}"></label>
    <label class="field" for="ni-amount">סכום כולל מע"מ<input id="ni-amount" type="number" step="any" inputmode="decimal" data-new="amount" value="${esc(f.amount)}"></label>
    <label class="field" for="ni-terms">תנאי תשלום<select id="ni-terms" data-new="terms"><option value="">לפי הספק</option>${kvOpts(TERMS, f.terms)}</select></label>

  </div><div class="row" style="margin-top:10px"><button class="btn pri" data-act="saveInv">שמירת חשבונית</button><small class="note">ריק בתנאי תשלום = לוקח את התנאי שמוגדר לספק.</small></div></section>`;
}

/* ---------- ספקים ---------- */
PAGES.suppliers = () => {
  const rows = S.suppliers.slice().sort((a, b) => String(a.name).localeCompare(b.name, 'he'));
  const open = n => sum(S.invoices.filter(i => i.supplier === n && i.status !== 'paid'));
  return `<div class="head"><div><h2>ספקים</h2><p class="lead">תנאי התשלום של הספק נכנסים אוטומטית לכל חשבונית חדשה שלו. הקישור להזמנה ישמש בהמשך להתראות מלאי.</p></div><button class="btn pri" data-act="add" data-col="suppliers" ${dis()}>+ ספק</button></div>
  <div class="tbl"><table><thead><tr><th>שם</th><th>מה קונים</th><th>איש קשר</th><th>טלפון</th><th>אימייל</th><th>קישור להזמנה</th><th>תנאי תשלום</th><th>פתוח לתשלום</th><th></th></tr></thead><tbody>
  ${rows.map(s => `<tr><td>${inp('suppliers', s, 'name', 'w-m')}</td><td>${inp('suppliers', s, 'buys', 'w-s')}</td><td>${inp('suppliers', s, 'contact', 'w-s')}</td><td>${inp('suppliers', s, 'phone', 'w-s', 0, 'tel')}</td><td>${inp('suppliers', s, 'email', 'w-s', 0, 'email')}</td>
    <td style="white-space:nowrap">${inp('suppliers', s, 'website', 'w-s', 0, 'url')}${/^https?:\/\//.test(s.website || '') ? ` <a href="${esc(s.website)}" target="_blank" rel="noopener" aria-label="פתיחת אתר הספק">↗</a>` : ''}</td>
    <td><select id="suppliers-${s.id}-terms" data-col="suppliers" data-id="${s.id}" data-f="terms" ${dis()}>${kvOpts(TERMS, s.terms || 'immediate')}</select></td>
    <td class="num">${ils(open(s.name))}</td><td>${delBtn('suppliers', s.id, 'מחיקה')}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">אין ספקים עדיין.</td></tr>'}
  </tbody></table></div>`;
};

/* ---------- נתונים והגדרות ---------- */
PAGES.data = () => {
  const s = S.settings, imp = ui.imp;
  const listField = (k, l) => `<label class="field" for="set-${k}">${l}<textarea id="set-${k}" rows="3" data-setting="${k}" data-list ${dis()}>${esc((s[k] || []).join(', '))}</textarea></label>`;
  return `<div class="head"><div><h2>נתונים והגדרות</h2><p class="lead">ייבוא הנתונים מהאקסל שבעל העסק ממלא, גיבוי לאקסל, והגדרות החישוב.</p></div></div>
  <section class="panel"><h3>ייבוא מאקסל</h3>
    <p class="muted" style="margin:0 0 10px">בוחרים את קובץ האקסל של איסוף הנתונים, או קובץ שיוצא מכאן ועודכן. שורות הדוגמה בקובץ מדולגות אוטומטית. לפני השמירה מוצג סיכום של מה שנמצא. אפשר לייבא קובץ מעודכן שוב בכל פעם, וגם לערוך כל נתון ישירות במערכת.</p>
    <div class="row"><label class="btn ${readonly ? '' : 'pri'}" for="impFile">בחירת קובץ אקסל</label><input id="impFile" type="file" accept=".xlsx,.xls,.csv" hidden ${dis()}>${typeof XLSX === 'undefined' ? '<small class="neg">ספריית האקסל לא נטענה. בדוק חיבור לאינטרנט.</small>' : ''}</div>
    ${imp ? `<div style="margin-top:12px" class="grid">
      <div class="tbl"><table><thead><tr><th>גיליון</th><th>שורות שנמצאו</th></tr></thead><tbody>${imp.summary.map(([k, n]) => `<tr><td>${esc(k)}</td><td class="num">${n}</td></tr>`).join('')}</tbody></table></div>
      ${imp.warnings.length ? `<div class="banner"><b>שימו לב:</b> ${imp.warnings.slice(0, 8).map(esc).join(' · ')}${imp.warnings.length > 8 ? ` ועוד ${imp.warnings.length - 8}` : ''}</div>` : ''}
      <div class="row"><button class="btn pri" data-act="impApply" data-mode="replace" ${dis()}>עדכון המערכת לפי הקובץ</button><button class="btn" data-act="impApply" data-mode="merge" ${dis()}>הוספה לנתונים הקיימים</button><button class="btn ghost" data-act="impCancel">ביטול</button></div>
      <small class="note">"עדכון לפי הקובץ" מוחק את נתוני הדוגמה, ומחליף כל טבלה שמופיעה בקובץ בגרסה שבקובץ. טבלאות שלא בקובץ (למשל יומן ההוצאות) נשארות כמו שהן. "הוספה" רק מוסיפה שורות חדשות.</small></div>` : ''}
    ${ui.impBusy ? `<p class="muted">${esc(ui.impBusy)}</p>` : ''}
  </section>
  ${mode === 'sheets' ? `<section class="panel"><h3>חיבור לגוגל שיטס</h3><div class="row">
    ${ui.sheetUrl ? `<a class="btn" href="${esc(ui.sheetUrl)}" target="_blank" rel="noopener">פתיחת הגיליון ↗</a>` : ''}
    <button class="btn" data-act="refresh">רענון נתונים</button>
    ${!COLS.some(c => S[c].length) ? '<button class="btn" data-act="loadSample">טעינת נתוני דוגמה</button>' : ''}
    ${token ? '<button class="btn ghost" data-act="logout">יציאה מהמכשיר הזה</button>' : ''}</div>
    <small class="note">כל שינוי באתר נשמר לגיליון תוך שנייה-שתיים. שינויים של אחרים מופיעים כאן תוך דקה, או מיד בלחיצה על "רענון".</small></section>` : ''}
  <section class="panel"><h3>גיבוי וייצוא</h3><div class="row">
    <button class="btn" data-act="exportAll">ייצוא כל הנתונים לאקסל</button>
    ${hasSample() ? `${delBtn('sample', 'all', 'מחיקת נתוני הדוגמה').replace('>✕<', '>מחיקת נתוני הדוגמה<')}` : ''}
  </div><small class="note">קובץ הייצוא בנוי באותו מבנה של קובץ האיסוף, כך שאפשר לערוך ולייבא אותו בחזרה.</small></section>
  <section class="panel"><h3>הגדרות חישוב</h3><div class="form">
    <label class="field" for="set-businessType">סוג עוסק<select id="set-businessType" data-setting="businessType" ${dis()}>${kvOpts({ murshe: 'עוסק מורשה / חברה', patur: 'עוסק פטור' }, s.businessType)}</select></label>
    <label class="field" for="set-vat">מע"מ %<input id="set-vat" type="number" step="0.5" data-setting="vat" data-num value="${esc(s.vat)}" ${dis()}></label>
    <label class="field" for="set-fcGood">עלות מזון "ירוקה" עד %<input id="set-fcGood" type="number" data-setting="fcGood" data-num value="${esc(s.fcGood)}" ${dis()}></label>
    <label class="field" for="set-fcWarn">עלות מזון "צהובה" עד %<input id="set-fcWarn" type="number" data-setting="fcWarn" data-num value="${esc(s.fcWarn)}" ${dis()}></label>
    <label class="field" for="set-targetFc">יעד עלות מזון למחיר מומלץ %<input id="set-targetFc" type="number" data-setting="targetFc" data-num value="${esc(s.targetFc)}" ${dis()}></label>
    <label class="field" for="set-workDays">ימי פעילות בחודש<input id="set-workDays" type="number" data-setting="workDays" data-num value="${esc(s.workDays)}" ${dis()}></label>
    <label class="field" for="set-autoLedger">חשבונית ששולמה נרשמת ביומן ההוצאות<select id="set-autoLedger" data-setting="autoLedger" data-boolsel ${dis()}><option value="1" ${s.autoLedger ? 'selected' : ''}>כן</option><option value="0" ${!s.autoLedger ? 'selected' : ''}>לא</option></select></label>
  </div>
  <p class="muted" style="margin:10px 0 0;font-size:.88rem">${isMurshe() ? 'בעוסק מורשה כל העלויות והמחירים מחושבים ללא מע"מ, כי המע"מ על קניות מתקזז.' : 'בעוסק פטור אין קיזוז מע"מ, ולכן העלויות כוללות מע"מ והמחיר ללקוח הוא ההכנסה.'}</p></section>
  <section class="panel"><h3>קטגוריות</h3><p class="muted" style="margin:0 0 10px">זמניות. נדייק אחרי שנקבל את הנתונים של בעל העסק. מפרידים בפסיק.</p><div class="grid g2">
    ${listField('ingCats', 'קטגוריות חומרי גלם')}${listField('dishCats', 'קטגוריות מנות')}${listField('fixedCats', 'קטגוריות הוצאות קבועות')}${listField('varCats', 'קטגוריות הוצאות שוטפות')}${listField('incomeCats', 'ערוצי הכנסה')}${listField('methods', 'אמצעי תשלום')}
  </div></section>
`;
};

/* ===================== אירועים ===================== */
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'monthSel') { month = t.value || ymNow(); render(); return; }
  if (t.id === 'dishSort') { ui.dishSort = t.value; render(); return; }
  if (t.id === 'optSel') { ui.optId = t.value; ui.sim = null; ui.claude = ''; render(); return; }
  if (t.dataset.filter) { ui[t.dataset.filter] = t.value; render(); return; }

function sheetRows(ws, spec) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  let hi = -1, map = null;
  for (let r = 0; r < Math.min(aoa.length, 15); r++) {
    const hdr = aoa[r].map(norm);
    const m = {}; let hits = 0;
    spec.cols.forEach(([key, label, alts]) => {
      const cands = [label, ...(alts || [])].map(norm);
      let idx = hdr.findIndex(h => h && h === cands[0]);
      if (idx < 0) for (const c of cands) { idx = hdr.findIndex((h, j) => h && h.includes(c) && !Object.values(m).includes(j)); if (idx >= 0) break; }
      if (idx >= 0) { m[key] = idx; hits++; }
    });
    if (hits >= 2) { hi = r; map = m; break; }
  }
  if (hi < 0) return [];
  const out = [];
  for (let r = hi + 1; r < aoa.length; r++) {
    const row = aoa[r];
    if (row.some(c => /שורת דוגמה/.test(String(c)))) continue;
    const o = {}; let any = false;
    for (const k in map) { let v = row[map[k]]; if (typeof v === 'string') v = v.trim(); if (typeof v === 'string' && v.startsWith('=')) v = ''; o[k] = v; }
    const first = o[spec.cols[0][0]];
    any = first !== '' && first != null;
    if (any) out.push(o);
  }
  return out;
}

  if (found.channels) res.sets.channels = found.channels.map(r => ({ id: sid('c'), name: String(r.name), avg: num(r.avg), low: num(r.low), high: num(r.high), fee: pctVal(r.fee), source: r.source || '', notes: r.notes || '' }));
  if (found.invoices) res.sets.invoices = found.invoices.filter(r => r.supplier || num(r.amount)).map(r => {
    const sup = (res.sets.suppliers || S.suppliers).find(s => s.name === r.supplier);
    return { id: sid('v'), number: String(r.number), supplier: r.supplier || '', date: parseDate(r.date), amount: num(r.amount), terms: r.terms ? parseTerms(r.terms) : (sup ? sup.terms : 'immediate'), status: parseStatus(r.status), paidDate: parseDate(r.paidDate), method: r.method || '', sentToAccountant: yes(r.sentToAccountant), fileId: '', fileName: '', notes: r.notes || '' };
  });
  if (found.expenses) res.sets.expenses = found.expenses.map(r => ({ id: sid('e'), date: parseDate(r.date), category: r.category || '', desc: r.desc || '', supplier: r.supplier || '', amount: num(r.amount), method: r.method || '' })).filter(r => r.amount);
  if (found.income) res.sets.income = found.income.map(r => ({ id: sid('n'), date: parseDate(r.date), category: r.category || '', desc: r.desc || '', amount: num(r.amount) })).filter(r => r.amount);
  if (found.business) found.business.forEach(r => {
    const t = norm(r.topic), v = r.answer;
    if (v === '' || v == null) return;
    if (t.includes(norm('מע"מ'))) res.settings.vat = pctVal(v);
    else if (t.includes('סוגעוסק')) res.settings.businessType = /פטור/.test(String(v)) ? 'patur' : 'murshe';
    else if (t.includes('ימיפעילות')) { const n = num(v); res.settings.workDays = n && n <= 7 ? Math.round(n * 4.33) : n || DEF.workDays; }

  });

  for (const k in res.sets) res.summary.push([labels[k], res.sets[k].length]);

  if (Object.keys(res.settings).length) res.summary.push(['פרטי העסק', Object.keys(res.settings).length + ' הגדרות']);

}
async function applyImport(modeSel) {
  const imp = ui.imp; if (!imp) return;

  if (modeSel === 'replace') {
    COLS.forEach(c => { const replacing = !!imp.sets[c]; S[c].filter(x => replacing || x.sample).forEach(x => tasks.push(() => del(c, x.id))); });
  }
  await bulk(tasks);
  const w = []; for (const c in imp.sets) imp.sets[c].forEach(o => w.push(() => put(c, o)));
  await bulk(w);
  if (Object.keys(imp.settings).length) await saveSettings(imp.settings);
  ui.imp = null; ui.impBusy = ''; toast('הנתונים יובאו'); render();
}

function invRow(i) { const due = dueDate(i); return { 'מספר חשבונית': i.number, 'ספק': i.supplier, 'תאריך חשבונית': i.date, 'סכום כולל מע"מ (₪)': num(i.amount), 'תנאי תשלום': (TERMS[i.terms] || TERMS.immediate)[0], 'תאריך אחרון לתשלום': due ? ymd(due) : '', 'סטטוס תשלום': INV_STATUS[i.status || 'unpaid'], 'תאריך תשלום בפועל': i.paidDate || '', 'אמצעי תשלום': i.method || '', 'הועבר לרו"ח?': i.sentToAccountant ? 'כן' : 'לא', 'קובץ': i.fileUrl || i.fileName || '', 'הערות': i.notes || '' }; }
function makeBook(sheets) {

  for (const [n, rows] of Object.entries(sheets)) { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{}]); ws['!cols'] = Object.keys(rows[0] || {}).map(k => ({ wch: Math.max(10, Math.min(36, k.length + 2)) })); XLSX.utils.book_append_sheet(wb, ws, n.slice(0, 31)); }
  return XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
}
async function saveFile(filename, data) {
  const blob = new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  if (downloads) { try { await downloads.save({ filename, data: blob }); return true; } catch (e) { if (e && e.code === 'declined') return false; toast('השמירה לא הושלמה'); return false; } }
  if (mode !== 'db') { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true; }
  toast('הורדת קבצים לא זמינה בתצוגה הזו'); return false;
}
